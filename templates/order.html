<html lang="en">
<head>

</head>
<body>
    <header>
        <h1>
            <a href="/"><img src="/static/img/mainpict.png" alt="home"></a>
        </h1>
    </header>
    <img src="{{ .order.Image }}">
    <div class="deviceinfo">
        <h2>{{ .order.Title }}</h2>
        <span><b>Тип излучения:</b>{{ .order.RadiationType }}</span>
        <span><b>Источник излучения:</b>{{ .order.RadiationSource }}</span>
        <span><b>Зона максимального излучения:</b>{{ .order.MaxRadiationZone }}</span>
        <span><b>Типовая мощность:</b>{{ .order.AvgPower }}</span>
    </div>
    <span class="footer">© RIP 2025 Boguslavsky Andrey</span>
</body>
</html>
